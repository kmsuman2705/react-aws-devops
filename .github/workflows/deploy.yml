name: Build and Deploy React App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "840986437653"
  ECR_REPOSITORY: react-devops
  EC2_NAME: react-devops-web
  APP_CONTAINER: react-app
  APP_PORT: 8080

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840986437653:role/react-devops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Find running EC2
      - name: Get EC2 Instance ID
        run: |
          EC2_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$EC2_ID" = "None" ] || [ -z "$EC2_ID" ]; then
            echo "ERROR: Running EC2 instance not found"
            exit 1
          fi

          echo "EC2_INSTANCE_ID=$EC2_ID" >> "$GITHUB_ENV"

          echo "EC2 Instance ID: $EC2_ID"

      # 4. Test application
      - name: Test application
        run: |
          cd app
          npm ci
          npm run lint

      # 5. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          docker build \
            -t "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            ./app

      # 7. Tag Docker image
      - name: Tag Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          docker tag \
            "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      # 8. Push Docker image
      - name: Push Docker image to ECR
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          docker push \
            "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      # 9. Deploy with automatic rollback
      - name: Deploy to EC2 using SSM
        run: |

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "======================================"
          echo "Deploying image:"
          echo "$IMAGE_URI"
          echo "======================================"

          cat > /tmp/deploy.sh <<EOF
          #!/bin/bash

          set -u

          ECR_REGISTRY="${ECR_REGISTRY}"
          NEW_IMAGE="${IMAGE_URI}"
          CONTAINER="${APP_CONTAINER}"
          PORT="${APP_PORT}"

          echo "======================================"
          echo "DEPLOYMENT STARTED"
          echo "======================================"

          echo "New image:"
          echo "\$NEW_IMAGE"

          mkdir -p /opt/react-app

          echo "======================================"
          echo "Saving current running image"
          echo "======================================"

          CURRENT_IMAGE=\$(docker inspect "\$CONTAINER" \
            --format '{{.Config.Image}}' 2>/dev/null || true)

          if [ -n "\$CURRENT_IMAGE" ]; then
            echo "\$CURRENT_IMAGE" > /opt/react-app/previous-image
            echo "Previous image:"
            echo "\$CURRENT_IMAGE"
          else
            echo "No previous container found"
          fi

          echo "======================================"
          echo "Login to ECR"
          echo "======================================"

          aws ecr get-login-password \
            --region "${AWS_REGION}" | \
            docker login \
            --username AWS \
            --password-stdin "\$ECR_REGISTRY"

          echo "======================================"
          echo "Pulling new image"
          echo "======================================"

          if ! docker pull "\$NEW_IMAGE"; then
            echo "ERROR: Failed to pull new image"
            exit 20
          fi

          echo "======================================"
          echo "Removing old container"
          echo "======================================"

          docker rm -f "\$CONTAINER" 2>/dev/null || true

          sleep 2

          echo "======================================"
          echo "Checking port \$PORT"
          echo "======================================"

          if ss -lnt | grep -q ":\$PORT "; then
            echo "ERROR: Port \$PORT is still in use"
            ss -lntp | grep ":\$PORT " || true
            exit 21
          fi

          echo "Port \$PORT is free"

          echo "======================================"
          echo "Starting new container"
          echo "======================================"

          if ! docker run -d \
            --name "\$CONTAINER" \
            -p "\$PORT:80" \
            "\$NEW_IMAGE"; then

            echo "ERROR: Failed to start new container"
            exit 22
          fi

          echo "======================================"
          echo "Waiting for application"
          echo "======================================"

          sleep 8

          echo "======================================"
          echo "Container status"
          echo "======================================"

          docker ps -a --filter "name=\$CONTAINER"

          echo "======================================"
          echo "Health check"
          echo "======================================"

          HTTP_CODE=\$(curl -s \
            -o /dev/null \
            -w '%{http_code}' \
            "http://127.0.0.1:\$PORT" || true)

          echo "HTTP status: \$HTTP_CODE"

          if [ "\$HTTP_CODE" != "200" ]; then

            echo "======================================"
            echo "HEALTH CHECK FAILED"
            echo "======================================"

            docker ps -a --filter "name=\$CONTAINER"

            echo "Container logs:"
            docker logs "\$CONTAINER" 2>&1 || true

            echo "======================================"
            echo "STARTING AUTOMATIC ROLLBACK"
            echo "======================================"

            if [ ! -f /opt/react-app/previous-image ]; then
              echo "ERROR: Previous image not found"
              exit 30
            fi

            PREVIOUS_IMAGE=\$(cat /opt/react-app/previous-image)

            echo "Rollback image:"
            echo "\$PREVIOUS_IMAGE"

            docker rm -f "\$CONTAINER" 2>/dev/null || true

            sleep 2

            if ss -lnt | grep -q ":\$PORT "; then
              echo "ERROR: Port \$PORT still in use during rollback"
              ss -lntp | grep ":\$PORT " || true
              exit 31
            fi

            echo "Pulling previous image..."

            if ! docker pull "\$PREVIOUS_IMAGE"; then
              echo "ERROR: Failed to pull previous image"
              exit 32
            fi

            echo "Starting previous container..."

            if ! docker run -d \
              --name "\$CONTAINER" \
              -p "\$PORT:80" \
              "\$PREVIOUS_IMAGE"; then

              echo "CRITICAL: Rollback container failed to start"
              exit 33
            fi

            sleep 8

            ROLLBACK_HTTP_CODE=\$(curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              "http://127.0.0.1:\$PORT" || true)

            echo "Rollback HTTP status: \$ROLLBACK_HTTP_CODE"

            if [ "\$ROLLBACK_HTTP_CODE" != "200" ]; then

              echo "======================================"
              echo "CRITICAL: ROLLBACK FAILED"
              echo "======================================"

              docker ps -a --filter "name=\$CONTAINER"
              docker logs "\$CONTAINER" 2>&1 || true

              exit 34
            fi

            echo "======================================"
            echo "ROLLBACK SUCCESSFUL"
            echo "Previous version restored:"
            echo "\$PREVIOUS_IMAGE"
            echo "======================================"

            exit 40
          fi

          echo "======================================"
          echo "HEALTH CHECK PASSED"
          echo "======================================"

          echo "Deployment successful"
          echo "Running image:"
          docker inspect "\$CONTAINER" --format '{{.Config.Image}}'

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          EOF

          chmod +x /tmp/deploy.sh

          echo "Encoding deployment script..."

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy.sh)

          echo "Sending deployment script to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo $SCRIPT_B64 | base64 -d > /tmp/deploy.sh\",
              \"chmod +x /tmp/deploy.sh\",
              \"bash /tmp/deploy.sh\"
            ]" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "======================================"
          echo "Waiting for deployment..."
          echo "======================================"

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          WAIT_STATUS=$?

          set -e

          echo "======================================"
          echo "Deployment output"
          echo "======================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "======================================"
            echo "DEPLOYMENT FAILED"
            echo "======================================"
            exit 1
          fi

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "Health check passed."
          echo "======================================"
