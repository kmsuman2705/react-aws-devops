name: Build and Deploy React App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "840986437653"
  ECR_REPOSITORY: react-devops
  EC2_NAME: react-devops-web
  APP_CONTAINER: react-app
  APP_PORT: "8080"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840986437653:role/react-devops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Find running EC2 instance
      - name: Get EC2 Instance ID
        run: |
          EC2_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_NAME }}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$EC2_ID" = "None" ] || [ -z "$EC2_ID" ]; then
            echo "ERROR: Running EC2 instance not found"
            exit 1
          fi

          echo "EC2_INSTANCE_ID=$EC2_ID" >> "$GITHUB_ENV"

          echo "EC2 Instance ID: $EC2_ID"

      # 4. Test / Lint
      - name: Test application
        run: |
          cd app
          npm ci
          npm run lint

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Set image tag using Git commit SHA
      - name: Set Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Image tag: $IMAGE_TAG"

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}" \
            ./app

      # 8. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            "${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}" \
            "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

      # 9. Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

      # 10. Deploy to EC2
      - name: Deploy to EC2 using SSM
        run: |

          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "Deploying image:"
          echo "$IMAGE_URI"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"echo '=== Deployment started ==='\",
              \"echo 'New image: ${IMAGE_URI}'\",

              \"mkdir -p /opt/react-app\",

              \"echo '=== Saving current running image ==='\",
              \"CURRENT_IMAGE=\\$(docker inspect ${{ env.APP_CONTAINER }} --format '{{.Config.Image}}' 2>/dev/null || true)\",
              \"if [ -n \\\"\\$CURRENT_IMAGE\\\" ]; then echo \\\"\\$CURRENT_IMAGE\\\" > /opt/react-app/previous-image; echo \\\"Previous image: \\$CURRENT_IMAGE\\\"; else echo 'No previous container found'; fi\",

              \"echo '=== Login to ECR ==='\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",

              \"echo '=== Pulling new image ==='\",
              \"docker pull ${IMAGE_URI}\",

              \"echo '=== Removing old container ==='\",
              \"docker rm -f ${{ env.APP_CONTAINER }} 2>/dev/null || true\",

              \"echo '=== Cleaning unused container ==='\",
              \"docker container prune -f\",

              \"echo '=== Checking port ${APP_PORT} ==='\",
              \"if ss -lnt | grep -q ':${APP_PORT} '; then echo 'ERROR: Port ${APP_PORT} is already in use'; ss -lntp | grep ':${APP_PORT} ' || true; exit 1; fi\",

              \"echo '=== Starting new container ==='\",
              \"docker run -d --name ${{ env.APP_CONTAINER }} -p ${APP_PORT}:80 ${IMAGE_URI}\",

              \"echo '=== Waiting for application ==='\",
              \"sleep 8\",

              \"echo '=== Container status ==='\",
              \"docker ps -a --filter name=${{ env.APP_CONTAINER }}\",

              \"echo '=== Health check ==='\",
              \"HTTP_CODE=\\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${APP_PORT} || true)\",
              \"echo \\\"HTTP status: \\$HTTP_CODE\\\"\",

              \"if [ \\\"\\$HTTP_CODE\\\" != '200' ]; then echo '=== HEALTH CHECK FAILED ==='; docker logs ${{ env.APP_CONTAINER }} || true; exit 10; fi\",

              \"echo '=== Health check passed ==='\",

              \"echo '=== Deployment successful ==='\"
            ]" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment command
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}"; then

            echo "Deployment command completed successfully."

          else

            echo "Deployment command failed."
            echo "Starting rollback..."

            ROLLBACK_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "set -e",
                "echo \"=== ROLLBACK STARTED ===\"",

                "if [ ! -f /opt/react-app/previous-image ]; then echo \"ERROR: Previous image not found\"; exit 1; fi",

                "PREVIOUS_IMAGE=$(cat /opt/react-app/previous-image)",
                "echo \"Previous image: $PREVIOUS_IMAGE\"",

                "ECR_REGISTRY=\"840986437653.dkr.ecr.ap-south-1.amazonaws.com\"",

                "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY",

                "docker pull $PREVIOUS_IMAGE",

                "docker rm -f react-app 2>/dev/null || true",

                "docker container prune -f",

                "if ss -lnt | grep -q \":8080 \"; then echo \"ERROR: Port 8080 still in use during rollback\"; ss -lntp | grep \":8080 \" || true; exit 1; fi",

                "docker run -d --name react-app -p 8080:80 $PREVIOUS_IMAGE",

                "sleep 8",

                "docker ps -a --filter name=react-app",

                "HTTP_CODE=$(curl -s -o /dev/null -w \"%{http_code}\" http://127.0.0.1:8080 || true)",

                "echo \"Rollback HTTP status: $HTTP_CODE\"",

                "if [ \"$HTTP_CODE\" != \"200\" ]; then echo \"ROLLBACK HEALTH CHECK FAILED\"; docker logs react-app || true; exit 1; fi",

                "echo \"=== ROLLBACK SUCCESSFUL ===\""
              ]' \
              --region "${{ env.AWS_REGION }}" \
              --query 'Command.CommandId' \
              --output text)

            echo "Rollback Command ID: $ROLLBACK_COMMAND_ID"

            if aws ssm wait command-executed \
              --command-id "$ROLLBACK_COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "${{ env.AWS_REGION }}"; then

              echo "Rollback completed successfully."

              aws ssm get-command-invocation \
                --command-id "$ROLLBACK_COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}"

            else

              echo "CRITICAL: Rollback also failed."

              aws ssm get-command-invocation \
                --command-id "$ROLLBACK_COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}"

              exit 1

            fi

            echo "Original deployment failed, but previous version was restored."
            exit 1

          fi

          # Show deployment result
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}"

          echo "Deployment and health check successful!"
