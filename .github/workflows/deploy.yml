name: Build and Deploy React App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: react-devops
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840986437653:role/react-devops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Find running EC2 created by Terraform
      - name: Get EC2 Instance ID
        run: |
          EC2_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=react-devops-web" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$EC2_ID" = "None" ] || [ -z "$EC2_ID" ]; then
            echo "ERROR: Running EC2 instance not found"
            exit 1
          fi

          echo "EC2_INSTANCE_ID=$EC2_ID" >> "$GITHUB_ENV"

          echo "EC2 Instance ID: $EC2_ID"

      # 4. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            ./app

      # 6. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # 7. Push image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # 8. Deploy image to EC2 using SSM
      - name: Deploy to EC2 using SSM
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 840986437653.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 840986437653.dkr.ecr.ap-south-1.amazonaws.com/react-devops:latest",
              "docker rm -f react-app || true",
              "docker run -d --name react-app -p 8080:80 840986437653.dkr.ecr.ap-south-1.amazonaws.com/react-devops:latest",
              "docker ps",
              "curl -I http://127.0.0.1:8080"
            ]' \
            --region "${{ env.AWS_REGION }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait until deployment command completes
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}"

          # Show deployment result
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}"
